name: Test push only tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a tag to push
        run: |
          git tag -a "v0.0.2-only-tags-test-$(date +%s)" -m "Test tag for push_only_tags input"

      - id: push
        uses: .
        with:
          branch: act-harness
          github_token: ${{ github.token }}
          push_only_tags: 'true'
        continue-on-error: true

      - name: Assert push_only_tags ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.push.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: push_only_tags succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: push_only_tags failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
