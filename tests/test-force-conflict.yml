name: Test force and force-with-lease conflict
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: push
        uses: .
        with:
          branch: act-harness
          github_token: ${{ github.token }}
          force: 'true'
          force_with_lease: 'true'
        continue-on-error: true

      - name: Assert action failed due to conflicting force options
        env:
          OUTCOME: ${{ steps.push.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when both force and force_with_lease were set"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with conflicting force options"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
