name: Test basic push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a test commit to push
        run: |
          echo "test-$(date +%s)" > tests/test-artifact.txt
          git add tests/test-artifact.txt
          git commit -m "test: add artifact for push test" || echo "Nothing to commit"

      - id: push
        uses: .
        with:
          branch: act-harness
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert push ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.push.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: push succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: push failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
