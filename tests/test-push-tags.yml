name: Test push with tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a test commit and tag
        run: |
          echo "tags-test-$(date +%s)" > tests/tags-test-artifact.txt
          git add tests/tags-test-artifact.txt
          git commit -m "test: add artifact for tags push test" || echo "Nothing to commit"
          git tag -a "v0.0.1-test-$(date +%s)" -m "Test tag for push action"

      - id: push
        uses: .
        with:
          branch: act-harness
          github_token: ${{ github.token }}
          tags: 'true'
        continue-on-error: true

      - name: Assert push with tags ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.push.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: push with tags succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: push with tags failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
